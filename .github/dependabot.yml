version: 2

updates:
  # --- Gradle dependencies (app + gradle plugin ecosystem) ---
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    ignore:
      # Kotlin 2.4.20+: CodeQL 2.27 refuses to compile it ("currently supports versions below
      # 2.4.20", measured on Agenda Tech). A bump PR would fail on every run. Remove once a CodeQL
      # release supports it.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.20"]
    # Group patch bumps to reduce PR noise.
    groups:
      androidx-patch:
        patterns:
          - "androidx.*"
        update-types:
          - "patch"
      compose-patch:
        patterns:
          - "androidx.compose.*"
        update-types:
          - "patch"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
