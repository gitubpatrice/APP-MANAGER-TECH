name: "CodeQL — App Manager Tech"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly scan: Monday 02:17 UTC
    - cron: "17 2 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "java-kotlin" ]
        # Add "actions" if you want to scan workflow files too.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Extend default queries with security-and-quality suite.
          queries: security-and-quality

      - name: Build (debug — no signing needed)
        # CodeQL Java/Kotlin tracer must OBSERVE the actual compiler invocation
        # to extract bytecode. When the Gradle build cache returns
        # `compileDebugKotlin FROM-CACHE`, no compiler runs and CodeQL fails
        # with "could not process any of it". `--no-build-cache --rerun-tasks`
        # force fresh execution so the tracer sees every task.
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --rerun-tasks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
