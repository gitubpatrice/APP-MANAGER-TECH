# Project-wide Gradle settings for App Manager Tech.
#
# v0.1.2 fix — added because CI (GitHub Actions CodeQL workflow) was failing
# with `Configuration ':app:debugRuntimeClasspath' contains AndroidX
# dependencies, but the android.useAndroidX property is not enabled`.
# Locally Android Studio injects this implicitly; the CI runner does not.

# AndroidX (mandatory for Compose / Material 3 / Hilt / Room).
android.useAndroidX=true

# Disable Jetifier — we don't depend on any legacy support library.
android.enableJetifier=false

# Build performance.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin code style for IDE integration.
kotlin.code.style=official

# AndroidX optional: enable non-transitive R classes to keep the R class lean.
android.nonTransitiveRClass=true
