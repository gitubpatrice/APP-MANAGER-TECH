[versions]
# --- Kotlin ---
kotlin                  = "2.1.0"
ksp                     = "2.1.0-1.0.29"

# --- Android Gradle Plugin ---
agp                     = "8.7.3"

# --- AndroidX Core ---
androidxCore            = "1.15.0"
androidxActivity        = "1.9.3"
androidxLifecycle       = "2.8.7"
androidxNavigation      = "2.8.4"

# --- Compose ---
composeBom              = "2024.12.01"

# --- Hilt ---
hilt                    = "2.55"
hiltNavigationCompose   = "1.2.0"

# --- Room ---
room                    = "2.6.1"

# --- DataStore ---
datastore               = "1.1.1"

# --- SplashScreen (compat for API 26–30) ---
androidxSplashscreen    = "1.0.1"

# --- Coroutines ---
coroutines              = "1.9.0"

# --- WorkManager ---
workManager             = "2.10.0"
hiltWork                = "1.2.0"

# --- Coil ---
coil                    = "2.7.0"

# --- Timber ---
timber                  = "5.0.1"

# --- Tests ---
junit                   = "5.11.3"
truth                   = "1.4.4"
robolectric             = "4.14.1"
androidxTestCore        = "1.6.1"
androidxTestRunner      = "1.6.2"
mockk                   = "1.14.9"
turbine                 = "1.2.0"

# --- Gradle test bridging ---
junitVintage            = "5.11.3"

[libraries]
# Core
androidx-core-ktx                       = { group = "androidx.core",                   name = "core-ktx",                          version.ref = "androidxCore" }
androidx-activity-compose               = { group = "androidx.activity",               name = "activity-compose",                  version.ref = "androidxActivity" }

# Lifecycle
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",              name = "lifecycle-runtime-ktx",             version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",              name = "lifecycle-viewmodel-compose",        version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",              name = "lifecycle-runtime-compose",          version.ref = "androidxLifecycle" }

# Compose BOM
compose-bom                             = { group = "androidx.compose",                name = "compose-bom",                       version.ref = "composeBom" }
compose-ui                              = { group = "androidx.compose.ui",             name = "ui" }
compose-ui-graphics                     = { group = "androidx.compose.ui",             name = "ui-graphics" }
compose-ui-tooling                      = { group = "androidx.compose.ui",             name = "ui-tooling" }
compose-ui-tooling-preview              = { group = "androidx.compose.ui",             name = "ui-tooling-preview" }
compose-ui-test-manifest                = { group = "androidx.compose.ui",             name = "ui-test-manifest" }
compose-ui-test-junit4                  = { group = "androidx.compose.ui",             name = "ui-test-junit4" }
compose-material3                       = { group = "androidx.compose.material3",      name = "material3" }
compose-material-icons-extended         = { group = "androidx.compose.material",       name = "material-icons-extended" }

# Navigation
androidx-navigation-compose             = { group = "androidx.navigation",             name = "navigation-compose",                version.ref = "androidxNavigation" }

# Hilt
hilt-android                            = { group = "com.google.dagger",               name = "hilt-android",                      version.ref = "hilt" }
hilt-android-compiler                   = { group = "com.google.dagger",               name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose                 = { group = "androidx.hilt",                   name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }
hilt-work                               = { group = "androidx.hilt",                   name = "hilt-work",                         version.ref = "hiltWork" }
hilt-work-compiler                      = { group = "androidx.hilt",                   name = "hilt-compiler",                     version.ref = "hiltWork" }

# Room
room-runtime                            = { group = "androidx.room",                   name = "room-runtime",                      version.ref = "room" }
room-ktx                                = { group = "androidx.room",                   name = "room-ktx",                          version.ref = "room" }
room-compiler                           = { group = "androidx.room",                   name = "room-compiler",                     version.ref = "room" }
room-testing                            = { group = "androidx.room",                   name = "room-testing",                      version.ref = "room" }

# DataStore
datastore-preferences                   = { group = "androidx.datastore",              name = "datastore-preferences",             version.ref = "datastore" }

# SplashScreen
androidx-splashscreen                   = { group = "androidx.core",                   name = "core-splashscreen",                 version.ref = "androidxSplashscreen" }

# Coroutines
coroutines-android                      = { group = "org.jetbrains.kotlinx",           name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
coroutines-test                         = { group = "org.jetbrains.kotlinx",           name = "kotlinx-coroutines-test",           version.ref = "coroutines" }

# WorkManager
work-runtime-ktx                        = { group = "androidx.work",                   name = "work-runtime-ktx",                  version.ref = "workManager" }

# Coil
coil-compose                            = { group = "io.coil-kt",                      name = "coil-compose",                      version.ref = "coil" }

# Timber
timber                                  = { group = "com.jakewharton.timber",          name = "timber",                            version.ref = "timber" }

# Tests — JUnit 5
junit-jupiter-api                       = { group = "org.junit.jupiter",               name = "junit-jupiter-api",                 version.ref = "junit" }
junit-jupiter-engine                    = { group = "org.junit.jupiter",               name = "junit-jupiter-engine",              version.ref = "junit" }
junit-jupiter-params                    = { group = "org.junit.jupiter",               name = "junit-jupiter-params",              version.ref = "junit" }

# Tests — Truth
truth                                   = { group = "com.google.truth",                name = "truth",                             version.ref = "truth" }

# Tests — Robolectric
robolectric                             = { group = "org.robolectric",                 name = "robolectric",                       version.ref = "robolectric" }

# Tests — AndroidX
androidx-test-core                      = { group = "androidx.test",                   name = "core",                              version.ref = "androidxTestCore" }
androidx-test-runner                    = { group = "androidx.test",                   name = "runner",                            version.ref = "androidxTestRunner" }

# Tests — MockK
mockk                                   = { group = "io.mockk",                        name = "mockk",                             version.ref = "mockk" }

# Tests — Turbine (StateFlow / Flow testing)
turbine                                 = { group = "app.cash.turbine",                name = "turbine",                           version.ref = "turbine" }

[plugins]
android-application    = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                   = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                    = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
room                   = { id = "androidx.room",                              version.ref = "room" }
