# Reproducible build pinned to the upstream-signed GitHub release APKs.
# F-Droid will build from source at the exact commit hash below and verify the
# resulting APK byte-for-byte against the GitHub asset referenced in Binaries.
Binaries: https://github.com/gitubpatrice/APP-MANAGER-TECH/releases/download/v%v/app-%a-release.apk

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    gradle:
      - yes
    rm:
      - app/lint-baseline.xml
    prebuild:
      - sed -i -e '/keystoreProperties = Properties/,/}/d' build.gradle.kts
      - sed -i -e '/signingConfigs/,/}\s*$/d' build.gradle.kts
      - sed -i -e '/if (keystorePropertiesFile.exists()) {/,/}/d' build.gradle.kts

