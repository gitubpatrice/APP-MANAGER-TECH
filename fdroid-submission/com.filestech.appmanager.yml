# SHA-256 fingerprint of the upstream APK signing certificate, lowercase hex
# (colons stripped). F-Droid uses this to verify the reproducible build matches
# the upstream signature — guaranteeing identical signature across both
# distribution channels (users can update freely between GitHub and F-Droid).
AllowedAPKSigningKeys: 76e8772e09951369405f58e70c4afffd41c4687553c6cfa03d08145ff60ff1cf

